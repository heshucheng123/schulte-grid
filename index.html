<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注力训练</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-start: #00D9FF;
      --primary-end: #0066FF;
      --success: #00C853;
      --error: #FF5252;
      --bg-gradient: linear-gradient(135deg, #0D1B2A 0%, #1B263B 50%, #0a1628 100%);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --grid-color: rgba(0, 217, 255, 0.03);
      --cell-bg: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      --shadow: rgba(0, 0, 0, 0.3);
      --overlay-bg: rgba(0, 0, 0, 0.85);
      --theme-transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --primary-start: #0066FF;
      --primary-end: #00D9FF;
      --success: #00A844;
      --error: #FF5252;
      --bg-gradient: linear-gradient(135deg, #e0e0e0 0%, #d5d5d5 50%, #cccccc 100%);
      --text-primary: #1a1a1a;
      --text-secondary: rgba(0, 0, 0, 0.6);
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-border: rgba(0, 0, 0, 0.12);
      --grid-color: rgba(0, 0, 0, 0.04);
      --cell-bg: rgba(255, 255, 255, 0.7);
      --shadow: rgba(0, 0, 0, 0.15);
      --overlay-bg: rgba(0, 0, 0, 0.7);
    }

    [data-theme="dark"] {
      --primary-start: #ffffff;
      --primary-end: #cccccc;
      --success: #00C853;
      --error: #FF5252;
      --bg-gradient: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #0d0d0d 100%);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --grid-color: rgba(255, 255, 255, 0.02);
      --cell-bg: rgba(255, 255, 255, 0.08);
      --shadow: rgba(0, 0, 0, 0.5);
      --overlay-bg: rgba(0, 0, 0, 0.85);
    }

    /* 绿白主题 - 清新青春毛玻璃风格 */
    [data-theme="green"] {
      --primary-start: #10B981;
      --primary-end: #34D399;
      --success: #059669;
      --error: #DC2626;
      --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 30%, #a7f3d0 70%, #d1fae5 100%);
      --text-primary: #065F46;
      --text-secondary: rgba(6, 95, 70, 0.7);
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-border: rgba(16, 185, 129, 0.3);
      --grid-color: rgba(16, 185, 129, 0.05);
      --cell-bg: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(209,250,229,0.6));
      --shadow: rgba(16, 185, 129, 0.15);
      --overlay-bg: rgba(255, 255, 255, 0.85);
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      transition: background var(--theme-transition);
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
      transition: background-image var(--theme-transition);
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      transition: all var(--theme-transition);
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
      transition: color var(--theme-transition);
    }

    .theme-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .theme-btn:hover {
      transform: scale(1.1);
    }

    .theme-btn.active {
      border-color: var(--primary-start);
      box-shadow: 0 0 15px var(--primary-start);
    }

    .theme-btn.theme-1 {
      background: linear-gradient(135deg, #0D1B2A, #0066FF);
    }

    .theme-btn.theme-2 {
      background: linear-gradient(135deg, #ffffff, #f0f0f0);
    }

    .theme-btn.theme-3 {
      background: linear-gradient(135deg, #000000, #333333);
    }

    /* 绿白主题按钮 */
    .theme-btn.theme-4 {
      background: linear-gradient(135deg, #10B981, #34D399);
    }

    /* 绿白主题按钮装饰 */
    .theme-btn.theme-4::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      opacity: 0.9;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .toolbar.hidden {
      display: none;
    }

    .mode-switcher {
      display: flex;
      gap: 10px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(15px);
      transition: all var(--theme-transition);
    }

    .mode-btn {
      padding: 10px 28px;
      border-radius: 50px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.4);
    }

    .random-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--primary-start);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(15px);
    }

    .random-btn:hover {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      border-color: var(--primary-start);
      transform: rotate(180deg);
    }

    .random-btn svg {
      width: 22px;
      height: 22px;
    }

    .timer {
      font-family: 'Orbitron', monospace;
      font-size: 3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 20px;
      transition: color var(--theme-transition);
    }

    .timer.running {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .progress-bar {
      width: 100%;
      max-width: 400px;
      height: 6px;
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      transition: all var(--theme-transition);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-start), var(--primary-end));
      border-radius: 10px;
      transition: width 0.3s ease, background var(--theme-transition);
    }

    .game-board {
      display: grid;
      gap: 4px;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px var(--shadow);
      transition: all var(--theme-transition);
      overflow: visible;
    }

    .game-board.grid-5 {
      width: 270px;
      grid-template-columns: repeat(5, 1fr);
    }

    .game-board.grid-7 {
      width: 350px;
      grid-template-columns: repeat(7, 1fr);
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: visible;
      margin: 2px;
    }

    .game-board.grid-7 .cell {
      font-size: 0.85rem;
    }

    .cell:hover:not(.completed):not(.wrong) {
      transform: translateY(-2px);
      border-color: var(--primary-start);
      box-shadow: 0 4px 15px var(--shadow);
    }

    .cell.completed {
      background: var(--success) !important;
      border-color: var(--success) !important;
      color: white !important;
      cursor: default;
    }

    .cell.wrong {
      animation: wrongShake 0.6s ease-out forwards !important;
      background: #DC2626 !important;
      border-color: #B91C1C !important;
      border-width: 3px !important;
      color: white !important;
      font-weight: 900 !important;
      cursor: pointer;
      z-index: 10 !important;
      box-shadow: 0 0 30px rgba(220, 38, 38, 0.9) !important;
      border-radius: 10px !important;
      opacity: 1 !important;
    }

    .hint {
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      transition: color var(--theme-transition);
    }

    /* 历史最高记录栏 */
    .record-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
      padding: 10px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      backdrop-filter: blur(15px);
      transition: all var(--theme-transition);
    }

    .record-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      transition: color var(--theme-transition);
    }

    .record-value {
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--success);
      transition: color var(--theme-transition);
    }

    .record-divider {
      width: 1px;
      height: 20px;
      background: var(--card-border);
      transition: background var(--theme-transition);
    }

    /* 新纪录提示动画 */
    .record-value.new-record {
      animation: newRecordPulse 0.6s ease-out;
    }

    @keyframes newRecordPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); color: #FFD700; }
      100% { transform: scale(1); }
    }

    .completion-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }

    .completion-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .completion-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px var(--shadow);
      transition: all var(--theme-transition);
    }

    .completion-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      transition: all var(--theme-transition);
    }

    .completion-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      transition: color var(--theme-transition);
    }

    .final-time {
      font-family: 'Orbitron', monospace;
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--success);
      margin-bottom: 20px;
      transition: color var(--theme-transition);
    }

    .focus-rating {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      padding: 15px 25px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      transition: all var(--theme-transition);
    }

    .focus-rating-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: color var(--theme-transition);
    }

    .focus-rating-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .focus-rating-badge.excellent {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #1a1a1a;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .focus-rating-badge.good {
      background: linear-gradient(135deg, #00E676, #00C853);
      color: #1a1a1a;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
    }

    .focus-rating-badge.poor {
      background: linear-gradient(135deg, #FF7043, #FF5722);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 112, 67, 0.4);
    }

    .focus-rating-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 8px;
      transition: color var(--theme-transition);
    }

    .restart-btn {
      padding: 14px 40px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .restart-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 217, 255, 0.4);
    }

    @keyframes cellAppear {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      10% { transform: translateX(-8px) rotate(-3deg); }
      20% { transform: translateX(8px) rotate(3deg); }
      30% { transform: translateX(-8px) rotate(-3deg); }
      40% { transform: translateX(8px) rotate(3deg); }
      50% { transform: translateX(-6px) rotate(-2deg); }
      60% { transform: translateX(6px) rotate(2deg); }
      70% { transform: translateX(-4px) rotate(-1deg); }
      80% { transform: translateX(4px) rotate(1deg); }
      90% { transform: translateX(-2px) rotate(0deg); }
    }

    @media (max-width: 480px) {
      .game-board.grid-5 { width: 260px; gap: 4px; padding: 8px; grid-template-columns: repeat(5, 1fr); }
      .game-board.grid-7 { width: 300px; gap: 3px; padding: 6px; grid-template-columns: repeat(7, 1fr); }
      .cell { font-size: 0.85rem; border-radius: 6px; }
      .game-board.grid-7 .cell { font-size: 0.7rem; }
      .mode-btn { padding: 8px 20px; font-size: 0.85rem; }
      h1 { font-size: 1.5rem; }
      .timer { font-size: 2.5rem; }
      .theme-btn { width: 32px; height: 32px; }
      .theme-switcher { gap: 6px; }
    }

    @media (max-width: 360px) {
      .game-board.grid-5 { width: 240px; gap: 3px; padding: 6px; }
      .game-board.grid-7 { width: 280px; gap: 2px; padding: 5px; }
      .cell { font-size: 0.75rem; border-radius: 4px; }
      .toolbar { gap: 10px; }
      .mode-btn { padding: 8px 18px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="theme-switcher">
    <button class="theme-btn theme-1 active" data-theme="default" title="深色科技"></button>
    <button class="theme-btn theme-2" data-theme="light" title="白色简约"></button>
    <button class="theme-btn theme-3" data-theme="dark" title="纯黑质感"></button>
    <button class="theme-btn theme-4" data-theme="green" title="绿白清新"></button>
  </div>

  <div class="container">
    <h1>专注力训练</h1>
    <p class="subtitle">舒尔特方格</p>

    <div class="toolbar">
      <div class="mode-switcher">
        <button class="mode-btn active" data-mode="5">5 × 5</button>
        <button class="mode-btn" data-mode="7">7 × 7</button>
      </div>
      <button class="random-btn" id="randomBtn" title="重新打乱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 11-9-9"/>
          <path d="M21 3v9h-9"/>
        </svg>
      </button>
    </div>

    <div class="timer" id="timer">0.00</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="game-board grid-5" id="gameBoard"></div>

    <p class="hint">点击 <span id="hintNum">1</span> 开始</p>

    <div class="record-bar" id="recordBar">
      <div class="record-item" data-mode="5">
        <span class="record-label">5×5 最佳</span>
        <span class="record-value" id="record5x5">--:--</span>
      </div>
      <div class="record-divider"></div>
      <div class="record-item" data-mode="7">
        <span class="record-label">7×7 最佳</span>
        <span class="record-value" id="record7x7">--:--</span>
      </div>
    </div>
  </div>

  <div class="completion-overlay" id="completionOverlay">
    <div class="completion-card">
      <h2 class="completion-title">恭喜完成！</h2>
      <p class="completion-subtitle">你的用时是</p>
      <div class="final-time" id="finalTime">0.00</div>
      <div class="focus-rating">
        <span class="focus-rating-label">专注力评级</span>
        <div class="focus-rating-badge" id="focusRatingBadge">
          <span id="focusRatingEmoji"></span>
          <span id="focusRatingText"></span>
        </div>
        <p class="focus-rating-desc" id="focusRatingDesc"></p>
      </div>
      <button class="restart-btn" id="restartBtn">再来一次</button>
    </div>
  </div>

  <script>
    const state = {
      mode: 5,
      numbers: [],
      currentNumber: 1,
      totalNumbers: 25,
      isStarted: false,
      isCompleted: false,
      startTime: null,
      timerInterval: null
    };

    const gameBoard = document.getElementById('gameBoard');
    const timerDisplay = document.getElementById('timer');
    const progressFill = document.getElementById('progressFill');
    const completionOverlay = document.getElementById('completionOverlay');
    const finalTimeDisplay = document.getElementById('finalTime');
    const restartBtn = document.getElementById('restartBtn');
    const modeButtons = document.querySelectorAll('.mode-btn');
    const hintNum = document.getElementById('hintNum');
    const randomBtn = document.getElementById('randomBtn');
    const themeButtons = document.querySelectorAll('.theme-btn');

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(ms) {
      return (ms / 1000).toFixed(2);
    }

    function initGame() {
      state.currentNumber = 1;
      state.totalNumbers = state.mode * state.mode;
      state.isStarted = false;
      state.isCompleted = false;
      state.startTime = null;
      
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }

      timerDisplay.textContent = '0.00';
      timerDisplay.classList.remove('running');
      progressFill.style.width = '0%';
      hintNum.textContent = '1';
      completionOverlay.classList.remove('show');

      gameBoard.className = `game-board grid-${state.mode}`;
      gameBoard.innerHTML = '';

      const numbers = [];
      for (let i = 1; i <= state.totalNumbers; i++) {
        numbers.push(i);
      }
      state.numbers = shuffle(numbers);

      const verificationSet = new Set(state.numbers);
      if (verificationSet.size !== state.totalNumbers) {
        console.error('数字生成错误：存在重复或缺失');
        state.numbers = numbers;
        state.numbers = shuffle(state.numbers);
      }


      for (let i = 0; i < state.numbers.length; i++) {
        const num = state.numbers[i];
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = num;
        cell.dataset.number = num;
        // 入场动画
        cell.style.opacity = '0';
        cell.style.transform = 'scale(0.8)';
        cell.style.animation = `cellAppear 0.3s ease-out forwards`;
        cell.style.animationDelay = `${i * 15}ms`;
        // 动画结束后清理animation属性
        const cleanupDelay = 300 + i * 15 + 50;
        setTimeout(() => {
          cell.style.opacity = '';
          cell.style.transform = '';
          cell.style.animation = '';
          cell.style.animationDelay = '';
        }, cleanupDelay);
        cell.addEventListener('click', () => handleCellClick(cell, num));
        gameBoard.appendChild(cell);
      }
    }

    function handleCellClick(cell, num) {
      if (state.isCompleted || cell.classList.contains('completed')) return;

      if (num === state.currentNumber) {
        cell.classList.add('completed');
        state.currentNumber++;
        hintNum.textContent = num === state.totalNumbers ? '🎉' : num + 1;
        progressFill.style.width = `${(num / state.totalNumbers) * 100}%`;

        if (num === 1) {
          state.isStarted = true;
          state.startTime = performance.now();
          timerDisplay.classList.add('running');
          state.timerInterval = setInterval(() => {
            timerDisplay.textContent = formatTime(performance.now() - state.startTime);
          }, 10);
        }

        if (num === state.totalNumbers) {
          completeGame();
        }
      } else {
        // 触发错误抖动动画
        // 关键：清除可能残留的入场动画样式，确保数字可见
        cell.style.opacity = '';
        cell.style.transform = '';
        cell.style.animation = '';
        cell.style.animationDelay = '';
        // 强制重绘后添加wrong类
        cell.offsetHeight;
        cell.classList.add('wrong');
        setTimeout(() => {
          cell.classList.remove('wrong');
        }, 600);
      }
    }

    function completeGame() {
      state.isCompleted = true;
      clearInterval(state.timerInterval);
      timerDisplay.classList.remove('running');
      const time = performance.now() - state.startTime;
      finalTimeDisplay.textContent = formatTime(time);
      progressFill.style.width = '100%';
      calculateFocusRating(time);
      setTimeout(() => completionOverlay.classList.add('show'), 500);
    }

    function calculateFocusRating(time) {
      const ratingBadge = document.getElementById('focusRatingBadge');
      const ratingEmoji = document.getElementById('focusRatingEmoji');
      const ratingText = document.getElementById('focusRatingText');
      const ratingDesc = document.getElementById('focusRatingDesc');
      
      const mode = state.mode;
      const totalCells = mode * mode;
      const avgTimePerCell = time / totalCells;
      
      const excellentThreshold = mode === 5 ? 800 : 600;
      const goodThreshold = mode === 5 ? 1200 : 900;
      
      ratingBadge.className = 'focus-rating-badge';
      
      if (avgTimePerCell < excellentThreshold) {
        ratingBadge.classList.add('excellent');
        ratingEmoji.textContent = '🌟';
        ratingText.textContent = '优秀';
        ratingDesc.textContent = '专注力极佳！';
      } else if (avgTimePerCell < goodThreshold) {
        ratingBadge.classList.add('good');
        ratingEmoji.textContent = '👍';
        ratingText.textContent = '良好';
        ratingDesc.textContent = '专注力不错！';
      } else {
        ratingBadge.classList.add('poor');
        ratingEmoji.textContent = '💪';
        ratingText.textContent = '一般';
        ratingDesc.textContent = '继续加油训练！';
      }
    }

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const newMode = parseInt(btn.dataset.mode);
        
        if (newMode === state.mode) return;
        
        if (state.isStarted && !state.isCompleted) {
          if (!confirm('游戏进行中，切换模式将重新开始？')) return;
        }
        
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        state.mode = newMode;
        initGame();
      });
    });

    restartBtn.addEventListener('click', () => {
      gameBoard.className = `game-board grid-${state.mode}`;
      initGame();
    });

    randomBtn.addEventListener('click', () => {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      gameBoard.className = `game-board grid-${state.mode}`;
      initGame();
    });

    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        themeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const theme = btn.dataset.theme;
        if (theme === 'default') {
          document.body.removeAttribute('data-theme');
        } else {
          document.body.setAttribute('data-theme', theme);
        }
      });
    });

    // 用户记录系统
    const USER_ID_KEY = 'schulte_user_id';
    const RECORD_KEY_PREFIX = 'schulte_record_';

    function getUserId() {
      let userId = localStorage.getItem(USER_ID_KEY);
      if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem(USER_ID_KEY, userId);
      }
      return userId;
    }

    function getRecord(mode) {
      const userId = getUserId();
      const key = RECORD_KEY_PREFIX + mode + '_' + userId;
      const record = localStorage.getItem(key);
      return record ? parseFloat(record) : null;
    }

    function saveRecord(mode, time) {
      const userId = getUserId();
      const key = RECORD_KEY_PREFIX + mode + '_' + userId;
      localStorage.setItem(key, time.toString());
    }

    function updateRecordDisplay() {
      const record5x5 = document.getElementById('record5x5');
      const record7x7 = document.getElementById('record7x7');

      const best5x5 = getRecord(5);
      const best7x7 = getRecord(7);

      record5x5.textContent = best5x5 ? (best5x5 / 1000).toFixed(2) : '--:--';
      record7x7.textContent = best7x7 ? (best7x7 / 1000).toFixed(2) : '--:--';
    }

    function checkAndUpdateRecord(mode, time) {
      const currentBest = getRecord(mode);

      if (currentBest === null || time < currentBest) {
        saveRecord(mode, time);

        const recordEl = document.getElementById(mode === 5 ? 'record5x5' : 'record7x7');
        recordEl.classList.add('new-record');
        setTimeout(() => recordEl.classList.remove('new-record'), 600);

        return true;
      }
      return false;
    }

    const originalCompleteGame = completeGame;
    completeGame = function() {
      const time = performance.now() - state.startTime;

      const isNewRecord = checkAndUpdateRecord(state.mode, time);

      updateRecordDisplay();

      if (isNewRecord) {
        const ratingDesc = document.getElementById('focusRatingDesc');
        const currentText = ratingDesc.textContent;
        ratingDesc.textContent = '🎉 新纪录！' + currentText;
      }

      originalCompleteGame.call(this);
    };

    initGame();
    updateRecordDisplay();
  </script>
</body>
</html>
