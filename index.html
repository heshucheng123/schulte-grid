<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注力训练</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-start: #00D9FF;
      --primary-end: #0066FF;
      --success: #00E676;
      --error: #FF5252;
      --bg-gradient: linear-gradient(135deg, #0D1B2A 0%, #1B263B 50%, #0a1628 100%);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --grid-color: rgba(0, 217, 255, 0.03);
      --cell-bg: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      --shadow: rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] {
      --primary-start: #0066FF;
      --primary-end: #00D9FF;
      --success: #00C853;
      --error: #FF5252;
      --bg-gradient: linear-gradient(135deg, #e0e0e0 0%, #d5d5d5 50%, #cccccc 100%);
      --text-primary: #1a1a1a;
      --text-secondary: rgba(0, 0, 0, 0.6);
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-border: rgba(0, 0, 0, 0.12);
      --grid-color: rgba(0, 0, 0, 0.04);
      --cell-bg: rgba(255, 255, 255, 0.7);
      --shadow: rgba(0, 0, 0, 0.15);
    }

    [data-theme="dark"] {
      --primary-start: #ffffff;
      --primary-end: #cccccc;
      --success: #00E676;
      --error: #FF5252;
      --bg-gradient: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #0d0d0d 100%);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --grid-color: rgba(255, 255, 255, 0.02);
      --cell-bg: rgba(255, 255, 255, 0.08);
      --shadow: rgba(0, 0, 0, 0.5);
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Poppins', system-ui, sans-serif;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      transition: background 0.3s ease;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .game-switcher {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .game-switch-btn {
      padding: 10px 20px;
      border-radius: 25px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .game-switch-btn:hover {
      border-color: var(--primary-start);
      color: var(--primary-start);
    }

    .game-switch-btn.active {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      border-color: transparent;
    }

    .theme-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-btn:hover {
      transform: scale(1.1);
    }

    .theme-btn.active {
      border-color: var(--primary-start);
      box-shadow: 0 0 15px var(--primary-start);
    }

    .theme-btn.theme-1 {
      background: linear-gradient(135deg, #0D1B2A, #0066FF);
    }

    .theme-btn.theme-2 {
      background: linear-gradient(135deg, #ffffff, #f0f0f0);
    }

    .theme-btn.theme-3 {
      background: linear-gradient(135deg, #000000, #333333);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .toolbar.hidden {
      display: none;
    }

    .mode-switcher {
      display: flex;
      gap: 10px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
    }

    .mode-btn {
      padding: 10px 28px;
      border-radius: 50px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.4);
    }

    .random-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--primary-start);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .random-btn:hover {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      border-color: var(--primary-start);
      transform: rotate(180deg);
    }

    .random-btn svg {
      width: 22px;
      height: 22px;
    }

    .timer {
      font-family: 'Orbitron', monospace;
      font-size: 3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 20px;
    }

    .timer.running {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .progress-bar {
      width: 100%;
      max-width: 400px;
      height: 6px;
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 1px solid var(--card-border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-start), var(--primary-end));
      border-radius: 10px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .game-board {
      display: grid;
      gap: 6px;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .game-board.grid-5 {
      width: 270px;
      grid-template-columns: repeat(5, 1fr);
    }

    .game-board.grid-7 {
      width: 350px;
      grid-template-columns: repeat(7, 1fr);
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .game-board.grid-7 .cell {
      font-size: 0.85rem;
    }

    .cell:hover:not(.completed) {
      transform: translateY(-2px);
      border-color: var(--primary-start);
      box-shadow: 0 4px 15px var(--shadow);
    }

    .cell.completed {
      background: var(--success);
      border-color: var(--success);
      color: white;
      cursor: default;
    }

    .cell.wrong {
      animation: wrongShake 0.4s ease-out !important;
      background: var(--error) !important;
      border-color: var(--error) !important;
      color: white !important;
      cursor: pointer;
    }

    .hint {
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* 历史最高记录栏 */
    .record-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
      padding: 10px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      backdrop-filter: blur(10px);
    }

    .record-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .record-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .record-value {
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--success);
    }

    .record-divider {
      width: 1px;
      height: 20px;
      background: var(--card-border);
    }

    /* 新纪录提示动画 */
    .record-value.new-record {
      animation: newRecordPulse 0.6s ease-out;
    }

    @keyframes newRecordPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); color: #FFD700; }
      100% { transform: scale(1); }
    }

    .completion-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }

    .completion-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .completion-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      backdrop-filter: blur(20px);
    }

    .completion-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .completion-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .final-time {
      font-family: 'Orbitron', monospace;
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--success);
      margin-bottom: 20px;
    }

    .focus-rating {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      padding: 15px 25px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    .focus-rating-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .focus-rating-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .focus-rating-badge.excellent {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #1a1a1a;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .focus-rating-badge.good {
      background: linear-gradient(135deg, #00E676, #00C853);
      color: #1a1a1a;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
    }

    .focus-rating-badge.poor {
      background: linear-gradient(135deg, #FF7043, #FF5722);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 112, 67, 0.4);
    }

    .focus-rating-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .restart-btn {
      padding: 14px 40px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .restart-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 217, 255, 0.4);
    }

    /* ==================== 数字记忆游戏样式 ==================== */
    .memory-game {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .memory-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      max-width: 700px;
      width: 100%;
    }

    .memory-header {
      text-align: center;
    }

    .memory-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .memory-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
    }

    /* 数字展示区域 */
    .numbers-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      min-height: 150px;
    }

    .numbers-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 30px 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      min-width: 300px;
      min-height: 100px;
      align-items: center;
    }

    .number-item {
      font-family: 'Orbitron', monospace;
      font-size: 3rem;
      font-weight: 900;
      color: var(--primary-start);
      text-shadow: 0 0 20px var(--primary-start);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s ease;
    }

    .number-item.visible {
      opacity: 1;
      transform: scale(1);
    }

    .number-item.hidden {
      opacity: 0;
      transform: scale(0) rotate(180deg);
    }

    /* 开始按钮 */
    .start-btn {
      padding: 16px 50px;
      border-radius: 50px;
      border: 2px solid var(--primary-start);
      background: transparent;
      color: var(--primary-start);
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .start-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      transition: left 0.3s ease;
      z-index: -1;
    }

    .start-btn:hover::before {
      left: 0;
    }

    .start-btn:hover {
      color: white;
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 217, 255, 0.4);
    }

    .start-btn:active {
      transform: translateY(-1px);
    }

    .start-btn.hidden {
      display: none;
    }

    .start-btn-text {
      position: relative;
      z-index: 1;
    }

    /* 输入框区域 */
    .inputs-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .input-prompt {
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .memory-inputs-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .memory-input-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .memory-input {
      width: 60px;
      height: 60px;
      font-size: 1.8rem;
      font-family: 'Orbitron', monospace;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text-primary);
      outline: none;
      text-align: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .memory-input:focus {
      border-color: var(--primary-start);
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
      transform: scale(1.05);
    }

    .memory-input.correct {
      border-color: var(--success);
      background: rgba(0, 230, 118, 0.15);
      color: var(--success);
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
    }

    .memory-input.wrong {
      border-color: var(--error);
      background: rgba(255, 82, 82, 0.15);
      color: var(--error);
      box-shadow: 0 0 15px rgba(255, 82, 82, 0.3);
      animation: inputShake 0.4s ease-out;
    }

    @keyframes inputShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    /* 统计信息 */
    .memory-stats-row {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .memory-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 25px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    .memory-stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .memory-stat-value {
      font-family: 'Orbitron', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-start);
    }

    .memory-stat-value.success {
      color: var(--success);
    }

    /* 数字入场动画 */
    @keyframes numberEnter {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 数字隐藏动画 */
    @keyframes numberHide {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) rotate(180deg); }
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    /* 舒尔特方格格子入场动画 */
    .cell {
      opacity: 0;
      animation: cellAppear 0.3s ease-out forwards;
    }

    @keyframes cellAppear {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 结果显示 */
    .result-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .result-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      backdrop-filter: blur(20px);
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }

    .result-overlay.show .result-card {
      transform: scale(1);
    }

    .result-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .result-text {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .result-answer {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .result-btn {
      padding: 14px 40px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .result-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
    }

    /* 倒计时提示 */
    .countdown-tip {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 15px;
    }

    @media (max-width: 480px) {
      .game-board.grid-5 { width: 260px; gap: 4px; padding: 8px; grid-template-columns: repeat(5, 1fr); }
      .game-board.grid-7 { width: 300px; gap: 3px; padding: 6px; grid-template-columns: repeat(7, 1fr); }
      .cell { font-size: 0.85rem; border-radius: 6px; }
      .game-board.grid-7 .cell { font-size: 0.7rem; }
      .mode-btn { padding: 8px 20px; font-size: 0.85rem; }
      h1 { font-size: 1.5rem; }
      .timer { font-size: 2.5rem; }
      .number-item { font-size: 2.2rem; }
      .memory-input { width: 55px; height: 55px; font-size: 1.5rem; }
      .numbers-container { padding: 20px 25px; gap: 10px; }
      .start-btn { padding: 14px 40px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="theme-switcher">
    <button class="theme-btn theme-1 active" data-theme="default" title="深色科技"></button>
    <button class="theme-btn theme-2" data-theme="light" title="白色简约"></button>
    <button class="theme-btn theme-3" data-theme="dark" title="纯黑质感"></button>
  </div>

  <div class="container" id="schulteContainer">
    <h1>专注力训练</h1>
    <p class="subtitle">大脑健身房</p>

    <div class="game-switcher">
      <button class="game-switch-btn active" data-game="schulte">舒尔特方格</button>
      <button class="game-switch-btn" data-game="memory">数字记忆</button>
    </div>

    <div class="toolbar">
      <div class="mode-switcher">
        <button class="mode-btn active" data-mode="5">5 × 5</button>
        <button class="mode-btn" data-mode="7">7 × 7</button>
      </div>
      <button class="random-btn" id="randomBtn" title="重新打乱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 11-9-9"/>
          <path d="M21 3v9h-9"/>
        </svg>
      </button>
    </div>

    <div class="timer" id="timer">0.00</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="game-board grid-5" id="gameBoard"></div>

    <p class="hint">点击 <span id="hintNum">1</span> 开始</p>

    <!-- 历史最高记录（固定在底部） -->
    <div class="record-bar" id="recordBar">
      <div class="record-item" data-mode="5">
        <span class="record-label">5×5 最佳</span>
        <span class="record-value" id="record5x5">--:--</span>
      </div>
      <div class="record-divider"></div>
      <div class="record-item" data-mode="7">
        <span class="record-label">7×7 最佳</span>
        <span class="record-value" id="record7x7">--:--</span>
      </div>
    </div>
  </div>

  <div class="completion-overlay" id="completionOverlay">
    <div class="completion-card">
      <h2 class="completion-title">恭喜完成！</h2>
      <p class="completion-subtitle">你的用时是</p>
      <div class="final-time" id="finalTime">0.00</div>
      <div class="focus-rating">
        <span class="focus-rating-label">专注力评级</span>
        <div class="focus-rating-badge" id="focusRatingBadge">
          <span id="focusRatingEmoji"></span>
          <span id="focusRatingText"></span>
        </div>
        <p class="focus-rating-desc" id="focusRatingDesc"></p>
      </div>
      <button class="restart-btn" id="restartBtn">再来一次</button>
    </div>
  </div>

  <!-- 数字记忆游戏 -->
  <div class="memory-game" id="memoryGame" style="display: none;">
    <div class="memory-container">
      <div class="memory-header">
        <h2 class="memory-title">数字记忆</h2>
        <p class="memory-subtitle">记忆屏幕上显示的数字</p>
      </div>

      <!-- 状态提示 -->
      <p class="countdown-tip" id="countdownTip">点击下方按钮开始记忆挑战</p>

      <!-- 数字展示区域（替代扑克牌） -->
      <div class="numbers-display" id="numbersDisplay">
        <div class="numbers-container" id="numbersContainer"></div>
      </div>

      <!-- 开始按钮 -->
      <button class="start-btn" id="startBtn">
        <span class="start-btn-text">开始挑战</span>
      </button>

      <!-- 输入框区域 -->
      <div class="inputs-section" id="inputsSection" style="display: none;">
        <p class="input-prompt">请输入你记忆的数字：</p>
        <div class="memory-inputs-row" id="memoryInputsRow"></div>
      </div>

      <!-- 统计信息 -->
      <div class="memory-stats-row">
        <div class="memory-stat">
          <span class="memory-stat-label">当前关卡</span>
          <span class="memory-stat-value" id="memoryLevel">4位</span>
        </div>
        <div class="memory-stat">
          <span class="memory-stat-label">最佳成绩</span>
          <span class="memory-stat-value success" id="memoryBest">4位</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 结果弹窗 -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <div class="result-icon" id="resultIcon"></div>
      <p class="result-text" id="resultText"></p>
      <p class="result-answer" id="resultAnswer"></p>
      <button class="result-btn" id="resultBtn">继续</button>
    </div>
  </div>

  <script>
    // ==================== 舒尔特方格游戏 ====================
    const state = {
      mode: 5,
      numbers: [],
      currentNumber: 1,
      totalNumbers: 25,
      isStarted: false,
      isCompleted: false,
      startTime: null,
      timerInterval: null
    };

    const gameBoard = document.getElementById('gameBoard');
    const timerDisplay = document.getElementById('timer');
    const progressFill = document.getElementById('progressFill');
    const completionOverlay = document.getElementById('completionOverlay');
    const finalTimeDisplay = document.getElementById('finalTime');
    const restartBtn = document.getElementById('restartBtn');
    const modeButtons = document.querySelectorAll('.mode-btn');
    const hintNum = document.getElementById('hintNum');
    const randomBtn = document.getElementById('randomBtn');
    const themeButtons = document.querySelectorAll('.theme-btn');
    const gameSwitchBtns = document.querySelectorAll('.game-switch-btn');

    function shuffle(array) {
      const arr = [...array];
      // Fisher-Yates 洗牌算法 - 确保完全随机
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(ms) {
      return (ms / 1000).toFixed(2);
    }

    function initGame() {
      // 重置所有状态
      state.currentNumber = 1;
      state.totalNumbers = state.mode * state.mode;
      state.isStarted = false;
      state.isCompleted = false;
      state.startTime = null;
      
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }

      timerDisplay.textContent = '0.00';
      timerDisplay.classList.remove('running');
      progressFill.style.width = '0%';
      hintNum.textContent = '1';
      completionOverlay.classList.remove('show');

      // 更新方阵尺寸
      gameBoard.className = `game-board grid-${state.mode}`;
      gameBoard.innerHTML = '';

      // 生成并打乱数字数组 - 确保1到N的完整序列
      const numbers = [];
      for (let i = 1; i <= state.totalNumbers; i++) {
        numbers.push(i);
      }
      state.numbers = shuffle(numbers);

      // 验证打乱结果：确保包含所有数字，无重复
      const verificationSet = new Set(state.numbers);
      if (verificationSet.size !== state.totalNumbers) {
        console.error('数字生成错误：存在重复或缺失');
        state.numbers = numbers;
        state.numbers = shuffle(state.numbers);
      }

      // 同步创建所有格子
      for (let i = 0; i < state.numbers.length; i++) {
        const num = state.numbers[i];
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = num;
        cell.dataset.number = num;
        cell.style.animationDelay = `${i * 15}ms`;
        cell.addEventListener('click', () => handleCellClick(cell, num));
        gameBoard.appendChild(cell);
      }
    }

    function handleCellClick(cell, num) {
      if (state.isCompleted || cell.classList.contains('completed')) return;

      if (num === state.currentNumber) {
        cell.classList.add('completed');
        state.currentNumber++;
        hintNum.textContent = num === state.totalNumbers ? '🎉' : num + 1;
        progressFill.style.width = `${(num / state.totalNumbers) * 100}%`;

        if (num === 1) {
          state.isStarted = true;
          state.startTime = performance.now();
          timerDisplay.classList.add('running');
          state.timerInterval = setInterval(() => {
            timerDisplay.textContent = formatTime(performance.now() - state.startTime);
          }, 10);
        }

        if (num === state.totalNumbers) {
          completeGame();
        }
      } else {
        cell.classList.add('wrong');
        setTimeout(() => cell.classList.remove('wrong'), 400);
      }
    }

    function completeGame() {
      state.isCompleted = true;
      clearInterval(state.timerInterval);
      timerDisplay.classList.remove('running');
      const time = performance.now() - state.startTime;
      finalTimeDisplay.textContent = formatTime(time);
      progressFill.style.width = '100%';
      calculateFocusRating(time);
      setTimeout(() => completionOverlay.classList.add('show'), 500);
    }

    function calculateFocusRating(time) {
      const ratingBadge = document.getElementById('focusRatingBadge');
      const ratingEmoji = document.getElementById('focusRatingEmoji');
      const ratingText = document.getElementById('focusRatingText');
      const ratingDesc = document.getElementById('focusRatingDesc');
      
      const mode = state.mode;
      const totalCells = mode * mode;
      const avgTimePerCell = time / totalCells;
      
      const excellentThreshold = mode === 5 ? 800 : 600;
      const goodThreshold = mode === 5 ? 1200 : 900;
      
      ratingBadge.className = 'focus-rating-badge';
      
      if (avgTimePerCell < excellentThreshold) {
        ratingBadge.classList.add('excellent');
        ratingEmoji.textContent = '🌟';
        ratingText.textContent = '优秀';
        ratingDesc.textContent = '专注力极佳！';
      } else if (avgTimePerCell < goodThreshold) {
        ratingBadge.classList.add('good');
        ratingEmoji.textContent = '👍';
        ratingText.textContent = '良好';
        ratingDesc.textContent = '专注力不错！';
      } else {
        ratingBadge.classList.add('poor');
        ratingEmoji.textContent = '💪';
        ratingText.textContent = '一般';
        ratingDesc.textContent = '继续加油训练！';
      }
    }

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const newMode = parseInt(btn.dataset.mode);
        
        // 如果点击的是当前模式，不做任何操作
        if (newMode === state.mode) return;
        
        // 如果游戏进行中，要求确认
        if (state.isStarted && !state.isCompleted) {
          if (!confirm('游戏进行中，切换模式将重新开始？')) return;
        }
        
        // 更新按钮状态
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 严格设置新模式
        state.mode = newMode;
        initGame();
      });
    });

    // 重玩按钮：保持当前模式不变
    restartBtn.addEventListener('click', () => {
      // 确保使用当前选定的模式
      gameBoard.className = `game-board grid-${state.mode}`;
      initGame();
    });

    randomBtn.addEventListener('click', () => {
      // 游戏进行中先停止计时器
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      // 确保保持当前模式，重新初始化
      gameBoard.className = `game-board grid-${state.mode}`;
      initGame();
    });

    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        themeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const theme = btn.dataset.theme;
        if (theme === 'default') {
          document.body.removeAttribute('data-theme');
        } else {
          document.body.setAttribute('data-theme', theme);
        }
      });
    });

    // ==================== 游戏切换功能 ====================
    const schulteContainer = document.getElementById('schulteContainer');
    const memoryGame = document.getElementById('memoryGame');

    // 游戏状态管理
    const gameState = {
      currentGame: 'schulte', // 当前活动游戏
      memoryGameInitialized: false // 数字记忆游戏是否已初始化
    };

    gameSwitchBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const game = btn.dataset.game;
        
        // 如果点击的是当前游戏，不做任何操作
        if (game === gameState.currentGame) return;
        
        // 更新按钮状态
        gameSwitchBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 切换游戏显示
        if (game === 'schulte') {
          schulteContainer.style.display = 'flex';
          memoryGame.style.display = 'none';
          gameState.currentGame = 'schulte';
        } else if (game === 'memory') {
          schulteContainer.style.display = 'none';
          memoryGame.style.display = 'flex';
          gameState.currentGame = 'memory';
          
          // 仅在首次切换到记忆游戏时初始化
          if (!gameState.memoryGameInitialized) {
            initMemoryGame();
            gameState.memoryGameInitialized = true;
          } else {
            // 重新初始化记忆游戏状态
            resetMemoryGameState();
          }
        }
      });
    });

    // ==================== 数字记忆游戏 ====================
    const numbersContainer = document.getElementById('numbersContainer');
    const startBtn = document.getElementById('startBtn');
    const memoryInputsRow = document.getElementById('memoryInputsRow');
    const inputsSection = document.getElementById('inputsSection');
    const countdownTip = document.getElementById('countdownTip');
    const memoryLevel = document.getElementById('memoryLevel');
    const memoryBest = document.getElementById('memoryBest');
    const resultOverlay = document.getElementById('resultOverlay');
    const resultIcon = document.getElementById('resultIcon');
    const resultText = document.getElementById('resultText');
    const resultAnswer = document.getElementById('resultAnswer');
    const resultBtn = document.getElementById('resultBtn');

    const memoryState = {
      currentLevel: 4,
      bestLevel: parseInt(sessionStorage.getItem('memoryBestLevel')) || 4,
      targetNumbers: [], // 改为数组存储每个数字
      isShowingNumbers: false,
      hasChecked: false
    };

    // 初始化/重置记忆游戏状态
    function resetMemoryGameState() {
      memoryBest.textContent = memoryState.bestLevel + '位';
      memoryLevel.textContent = memoryState.currentLevel + '位';
      inputsSection.style.display = 'none';
      numbersContainer.innerHTML = '';
      resultOverlay.classList.remove('show');
      memoryState.hasChecked = false;
      memoryState.isShowingNumbers = false;
      countdownTip.textContent = '点击下方按钮开始记忆挑战';
      startBtn.classList.remove('hidden');
      startBtn.querySelector('.start-btn-text').textContent = '开始挑战';
    }

    function initMemoryGame() {
      resetMemoryGameState();
    }

    // 开始按钮点击事件
    startBtn.addEventListener('click', () => {
      if (memoryState.isShowingNumbers || memoryState.hasChecked) return;
      startChallenge();
    });

    function startChallenge() {
      // 生成目标数字数组
      memoryState.targetNumbers = [];
      for (let i = 0; i < memoryState.currentLevel; i++) {
        memoryState.targetNumbers.push(Math.floor(Math.random() * 10));
      }
      
      // 创建数字显示元素
      createNumberDisplay();
      
      // 隐藏开始按钮
      startBtn.classList.add('hidden');
      
      // 显示数字
      setTimeout(() => {
        memoryState.isShowingNumbers = true;
        countdownTip.textContent = '请记住这些数字...';
        showNumbers();
        
        // 基准2秒，其他位数按比例缩放：显示时长 = 2000 × (当前位数 / 4)
        const displayDuration = 2000 * (memoryState.currentLevel / 4);
        setTimeout(() => {
          hideNumbers();
        }, displayDuration);
      }, 300);
    }

    function createNumberDisplay() {
      numbersContainer.innerHTML = '';
      
      for (let i = 0; i < memoryState.currentLevel; i++) {
        const numItem = document.createElement('div');
        numItem.className = 'number-item';
        numItem.textContent = memoryState.targetNumbers[i];
        numItem.dataset.index = i;
        numbersContainer.appendChild(numItem);
      }
    }

    function showNumbers() {
      const items = numbersContainer.querySelectorAll('.number-item');
      items.forEach((item, index) => {
        setTimeout(() => {
          item.classList.add('visible');
        }, index * 100);
      });
    }

    function hideNumbers() {
      const items = numbersContainer.querySelectorAll('.number-item');
      
      // 从后往前隐藏
      items.forEach((item, index) => {
        const reverseIndex = items.length - 1 - index;
        setTimeout(() => {
          items[reverseIndex].classList.remove('visible');
          items[reverseIndex].classList.add('hidden');
        }, index * 80);
      });
      
      // 所有数字隐藏后显示输入框
      setTimeout(() => {
        memoryState.isShowingNumbers = false;
        countdownTip.textContent = '请输入你记忆的数字';
        showInputSection();
      }, items.length * 80 + 300);
    }

    function showInputSection() {
      memoryInputsRow.innerHTML = '';
      
      for (let i = 0; i < memoryState.currentLevel; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'memory-input-wrapper';
        
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'memory-input';
        input.maxLength = 1;
        input.inputMode = 'numeric';
        input.pattern = '[0-9]';
        input.autocomplete = 'off';
        input.dataset.index = i;
        
        // 输入法限制：只允许数字
        input.addEventListener('input', (e) => {
          const value = e.target.value;
          // 只保留数字
          e.target.value = value.replace(/[^0-9]/g, '');
          
          // 如果输入了数字且不是最后一个，自动跳转下一个
          const currentIndex = parseInt(e.target.dataset.index);
          if (e.target.value && currentIndex < memoryState.currentLevel - 1) {
            // 正确获取下一个输入框（wrapper 内的 input）
            const wrappers = memoryInputsRow.querySelectorAll('.memory-input-wrapper');
            const nextWrapper = wrappers[currentIndex + 1];
            if (nextWrapper) {
              const nextInput = nextWrapper.querySelector('.memory-input');
              if (nextInput) nextInput.focus();
            }
          }
          
          // 检查是否所有输入框都已填写
          checkAllInputsFilled();
        });
        
        // 键盘事件处理
        input.addEventListener('keydown', (e) => {
          const currentIndex = parseInt(e.target.dataset.index);
          if (e.key === 'Backspace' && !e.target.value && currentIndex > 0) {
            // 如果当前输入框为空且不是第一个，跳转到上一个
            const wrappers = memoryInputsRow.querySelectorAll('.memory-input-wrapper');
            const prevWrapper = wrappers[currentIndex - 1];
            if (prevWrapper) {
              const prevInput = prevWrapper.querySelector('.memory-input');
              if (prevInput) {
                prevInput.focus();
                prevInput.value = '';
              }
            }
          } else if (e.key === 'Enter') {
            // 回车直接验证
            confirmAnswer();
          }
        });
        
        wrapper.appendChild(input);
        memoryInputsRow.appendChild(wrapper);
      }
      
      inputsSection.style.display = 'flex';
      
      // 聚焦第一个输入框
      setTimeout(() => {
        const firstInput = memoryInputsRow.querySelector('.memory-input');
        if (firstInput) firstInput.focus();
      }, 100);
    }

    // 检查是否所有输入框都已填写
    function checkAllInputsFilled() {
      const inputs = memoryInputsRow.querySelectorAll('.memory-input');
      let allFilled = true;
      
      for (let i = 0; i < inputs.length; i++) {
        if (!inputs[i].value) {
          allFilled = false;
          break;
        }
      }
      
      // 所有输入框都填写完成后自动验证
      if (allFilled) {
        confirmAnswer();
      }
    }

    function confirmAnswer() {
      if (memoryState.hasChecked || memoryState.isShowingNumbers) return;
      
      const inputs = memoryInputsRow.querySelectorAll('.memory-input');
      let answer = '';
      let allCorrect = true;
      
      // 检查每个输入
      inputs.forEach((input, index) => {
        const userValue = input.value;
        const correctValue = memoryState.targetNumbers[index].toString();
        answer += userValue;
        
        if (userValue === correctValue) {
          input.classList.add('correct');
          input.classList.remove('wrong');
        } else {
          input.classList.add('wrong');
          input.classList.remove('correct');
          allCorrect = false;
        }
      });
      
      if (answer.length < memoryState.currentLevel) {
        return;
      }
      
      memoryState.hasChecked = true;
      
      // 显示结果弹窗
      setTimeout(() => {
        if (allCorrect) {
          resultIcon.textContent = '✓';
          resultText.textContent = '正确！';
          resultText.style.color = 'var(--success)';
          resultAnswer.textContent = `答案是 ${memoryState.targetNumbers.join('')}`;
          
          memoryState.currentLevel++;
          memoryLevel.textContent = memoryState.currentLevel + '位';
          
          if (memoryState.currentLevel > memoryState.bestLevel) {
            memoryState.bestLevel = memoryState.currentLevel;
            sessionStorage.setItem('memoryBestLevel', memoryState.bestLevel);
            memoryBest.textContent = memoryState.bestLevel + '位';
          }
          
          resultBtn.textContent = '下一关';
        } else {
          resultIcon.textContent = '✗';
          resultText.textContent = '错误！';
          resultText.style.color = 'var(--error)';
          resultAnswer.textContent = `正确答案是 ${memoryState.targetNumbers.join('')}，你输入的是 ${answer}`;
          
          memoryState.currentLevel = 4;
          memoryLevel.textContent = memoryState.currentLevel + '位';
          
          resultBtn.textContent = '重新开始';
        }
        
        resultOverlay.classList.add('show');
      }, 500);
    }

    // 结果弹窗继续按钮
    resultBtn.addEventListener('click', () => {
      resultOverlay.classList.remove('show');
      setTimeout(() => {
        // 重置并显示开始按钮
        numbersContainer.innerHTML = '';
        inputsSection.style.display = 'none';
        startBtn.classList.remove('hidden');
        startBtn.querySelector('.start-btn-text').textContent = '再来一次';
        countdownTip.textContent = '点击下方按钮开始记忆挑战';
        memoryState.hasChecked = false;
        memoryState.isShowingNumbers = false;
      }, 300);
    });

    // 初始化舒尔特方格
    initGame();

    // ==================== 用户记录系统 ====================
    // 用户身份标识
    const USER_ID_KEY = 'schulte_user_id';
    const RECORD_KEY_PREFIX = 'schulte_record_';

    // 获取或生成用户ID
    function getUserId() {
      let userId = localStorage.getItem(USER_ID_KEY);
      if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem(USER_ID_KEY, userId);
      }
      return userId;
    }

    // 获取指定模式的历史最高记录
    function getRecord(mode) {
      const userId = getUserId();
      const key = RECORD_KEY_PREFIX + mode + '_' + userId;
      const record = localStorage.getItem(key);
      return record ? parseFloat(record) : null;
    }

    // 保存指定模式的历史最高记录
    function saveRecord(mode, time) {
      const userId = getUserId();
      const key = RECORD_KEY_PREFIX + mode + '_' + userId;
      localStorage.setItem(key, time.toString());
    }

    // 更新记录显示
    function updateRecordDisplay() {
      const record5x5 = document.getElementById('record5x5');
      const record7x7 = document.getElementById('record7x7');

      const best5x5 = getRecord(5);
      const best7x7 = getRecord(7);

      record5x5.textContent = best5x5 ? (best5x5 / 1000).toFixed(2) : '--:--';
      record7x7.textContent = best7x7 ? (best7x7 / 1000).toFixed(2) : '--:--';
    }

    // 检查并更新记录
    function checkAndUpdateRecord(mode, time) {
      const currentBest = getRecord(mode);

      // 如果没有记录或当前成绩更好
      if (currentBest === null || time < currentBest) {
        saveRecord(mode, time);

        // 触发新纪录动画
        const recordEl = document.getElementById(mode === 5 ? 'record5x5' : 'record7x7');
        recordEl.classList.add('new-record');
        setTimeout(() => recordEl.classList.remove('new-record'), 600);

        return true; // 返回true表示刷新了记录
      }
      return false;
    }

    // 在完成游戏时调用记录检查
    const originalCompleteGame = completeGame;
    completeGame = function() {
      const time = performance.now() - state.startTime;

      // 检查是否刷新记录
      const isNewRecord = checkAndUpdateRecord(state.mode, time);

      // 更新显示
      updateRecordDisplay();

      // 如果刷新了记录，显示提示
      if (isNewRecord) {
        const ratingDesc = document.getElementById('focusRatingDesc');
        const currentText = ratingDesc.textContent;
        ratingDesc.textContent = '🎉 新纪录！' + currentText;
      }

      // 调用原始完成逻辑
      originalCompleteGame.call(this);
    };

    // 页面加载时初始化记录显示
    updateRecordDisplay();
  </script>
</body>
</html>
